name: PostgreSQL store

on:
  push:
  pull_request:

jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: agentlogin_test
          POSTGRES_PASSWORD: local-test-password
          POSTGRES_DB: agentlogin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentlogin_test -d agentlogin_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      REQUIRE_POSTGRES_TESTS: '1'
      AGENTLOGIN_TEST_POSTGRES_URL: postgresql://agentlogin_test:local-test-password@localhost:5432/agentlogin_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Shared contracts and PostgreSQL adversarial tests (required)
        run: node --import tsx --test --test-concurrency=1 packages/issuer/test/store-contract.test.ts packages/store-postgres/test/*.test.ts
