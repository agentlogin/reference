name: Publish trusted-provider policy

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the prepared current-main policy after validating its decisions
        type: boolean
        required: true
        default: false
  schedule:
    # Off the hour; GitHub schedules can be delayed or dropped. Expiry still fails closed.
    - cron: '17 */4 * * *'
  push:
    branches: [main]
    paths:
      - 'trusted-providers/adoption.json'
      - 'trusted-providers/decisions.json'

permissions:
  contents: read

concurrency:
  group: trusted-provider-publication
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'agentlogin/reference' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      ready: ${{ steps.prepare.outputs.ready }}
      digest: ${{ steps.prepare.outputs.digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.4'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node --test trusted-providers/build.test.mjs trusted-providers/publisher.test.mjs trusted-providers/publication-git.test.mjs
      - run: npm run catalogs:build
      - name: Stage and validate exact release
        id: prepare
        run: node trusted-providers/publish.mjs prepare "$RUNNER_TEMP/provider-policy"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.prepare.outputs.ready == 'true'
        with:
          name: provider-policy
          path: ${{ runner.temp }}/provider-policy/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: prepare
    if: needs.prepare.outputs.ready == 'true' && (github.event_name != 'workflow_dispatch' || inputs.publish)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: provider-policy
    permissions:
      contents: write
      pages: write
    env:
      ARTIFACT_DIGEST: ${{ needs.prepare.outputs.digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.4'
          package-manager-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: provider-policy
          path: ${{ runner.temp }}/provider-policy
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Verify existing publication configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/agentlogin/reference/pages > "$RUNNER_TEMP/pages-config.json"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const p = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/pages-config.json`));
          assert.equal(p.build_type, 'legacy');
          assert.equal(p.source.branch, 'gh-pages');
          assert.equal(p.source.path, '/');
          assert.equal(p.html_url, 'https://agentlogin.github.io/reference/');
          assert.ok(!p.cname);
          NODE
      - name: Commit release and immutable recovery anchor atomically
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git --hostname github.com
          node trusted-providers/publish.mjs publish "$RUNNER_TEMP/provider-policy" "$ARTIFACT_DIGEST"
      - name: Request deployment explicitly
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/agentlogin/reference/pages/builds --silent
      - name: Verify deployed bytes with bounded propagation allowance
        run: |
          for attempt in $(seq 1 30); do
            if node trusted-providers/publish.mjs verify-live "$RUNNER_TEMP/provider-policy" "$ARTIFACT_DIGEST"; then
              exit 0
            fi
            sleep 10
          done
          echo 'Exact publication was not observed. Investigate; never restore an older active feed.' >&2
          exit 1
