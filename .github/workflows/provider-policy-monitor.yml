name: Monitor trusted-provider policy expiry

on:
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: Record a clearly labelled synthetic failure without contacting or changing the service
        type: boolean
        required: true
        default: false
  schedule:
    - cron: '8,23,38,53 * * * *'

permissions:
  contents: read

concurrency:
  group: trusted-provider-expiry-monitor
  cancel-in-progress: false

jobs:
  check:
    if: github.repository == 'agentlogin/reference' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.4'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm exec -- tsc -b packages/rp
      - name: Check absolute policy and review expiry
        env:
          SIMULATE_FAILURE: ${{ inputs.simulate_failure }}
        run: node trusted-providers/monitor.mjs "$RUNNER_TEMP/provider-policy-monitor"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: provider-policy-monitor
          path: ${{ runner.temp }}/provider-policy-monitor/
          if-no-files-found: warn
          retention-days: 14
